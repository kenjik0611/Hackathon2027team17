<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>男心理解ゲーム - 担当選択</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="main.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="app-header">
    <div class="header-inner scene-select-header">
      <div class="hero-copy">
        <p class="kicker">Insight Game</p>
        <h1>男心理解ゲーム</h1>
        <p class="lead">担当のタイプを見て、会話や恋愛観の読み取りクイズに挑戦しましょう。</p>
      </div>
    </div>
  </header>

  <main class="app-layout scene-select-layout">
    <section class="start-panel" aria-labelledby="scene-select-title">
      <p class="kicker">Scene Select</p>
      <h2 id="scene-select-title">誰の問題で遊びますか？</h2>

      <div class="scene-grid">
        <a class="scene-card" href="Arita/arita.html">
          <span class="scene-icon" aria-hidden="true">👤</span>
          <span class="profile-body">
            <strong>有田</strong>
            <small>仮プロフィール</small>
            <span class="type-row">
              <span class="type-pill">INTJ</span>
              <span>建築家</span>
            </span>
            <span class="type-row">
              <span class="type-pill love-pill">LCRO</span>
              <span>ボス猫</span>
            </span>
          </span>
        </a>

        <a class="scene-card" href="Kiyose/kiyose.html">
          <span class="scene-icon" aria-hidden="true">👤</span>
          <span class="profile-body">
            <strong>清瀬</strong>
            <small>仮プロフィール</small>
            <span class="type-row">
              <span class="type-pill">ENFP</span>
              <span>運動家</span>
            </span>
            <span class="type-row">
              <span class="type-pill love-pill">FCRO</span>
              <span>恋愛マジシャン</span>
            </span>
          </span>
        </a>

        <a class="scene-card" href="Suzuki/suzuki.html">
          <span class="scene-icon" aria-hidden="true">👤</span>
          <span class="profile-body">
            <strong>鈴木</strong>
            <small>仮プロフィール</small>
            <span class="type-row">
              <span class="type-pill">ISTP</span>
              <span>巨匠</span>
            </span>
            <span class="type-row">
              <span class="type-pill love-pill">FCRE</span>
              <span>賢いウサギ</span>
            </span>
          </span>
        </a>

        <a class="scene-card" href="Kudo/kudo.html">
          <span class="scene-icon" aria-hidden="true">👤</span>
          <span class="profile-body">
            <strong>工藤</strong>
            <small>仮プロフィール</small>
            <span class="type-row">
              <span class="type-pill">ENTJ</span>
              <span>指揮官</span>
            </span>
            <span class="type-row">
              <span class="type-pill love-pill">LAPE</span>
              <span>キャプテンライオン</span>
            </span>
          </span>
        </a>

        <a class="scene-card" href="Fukazawa/fukazawa.html">
          <span class="scene-icon" aria-hidden="true">👤</span>
          <span class="profile-body">
            <strong>深澤</strong>
            <span class="type-row">
              <span class="type-pill">ESFJ</span>
              <span>領事</span>
            </span>
            <span class="type-row">
              <span class="type-pill love-pill">FCPO</span>
              <span>恋愛モンスター</span>
            </span>
          </span>
        </a>
      </div>

      <div class="panel-actions">
        <a class="ghost-button" href="../index.html">トップへ戻る</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Hackathon 2027 Team 17</p>
  </footer>
</body>
</html>
