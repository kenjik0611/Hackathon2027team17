<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空気読メーター</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="hero-copy">
        <h1 class="app-title">
          <img src="./assets/kuukiyomi-logo.png" alt="空気読メーター" class="app-logo">
        </h1>
        <p class="lead">場の空気を読む力と、相手の考えを読み取る力を遊びながらチェック。</p>
      </div>

      <div class="hero-visual" aria-hidden="true">
        <svg class="hero-illustration" viewBox="0 0 360 260" role="img">
          <defs>
            <linearGradient id="hero-card-gradient" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#d8fff6"/>
            </linearGradient>
          </defs>
          <rect x="48" y="28" width="214" height="164" rx="18" fill="url(#hero-card-gradient)" stroke="#17202a" stroke-width="5"/>
          <rect x="74" y="60" width="120" height="14" rx="7" fill="#ffb703"/>
          <rect x="74" y="92" width="158" height="12" rx="6" fill="#7bdff2"/>
          <rect x="74" y="118" width="132" height="12" rx="6" fill="#f7a8b8"/>
          <rect x="74" y="144" width="92" height="12" rx="6" fill="#a7f3d0"/>
          <circle cx="274" cy="60" r="34" fill="#ffcf5a" stroke="#17202a" stroke-width="5"/>
          <path d="M258 61l10 10 22-24" fill="none" stroke="#17202a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M204 176c18-27 60-27 80 0" fill="#ffffff" stroke="#17202a" stroke-width="5"/>
          <circle cx="226" cy="142" r="20" fill="#7bdff2" stroke="#17202a" stroke-width="5"/>
          <circle cx="264" cy="142" r="20" fill="#f7a8b8" stroke="#17202a" stroke-width="5"/>
          <path d="M38 212h256" stroke="#17202a" stroke-width="5" stroke-linecap="round"/>
          <path d="M304 103h30M319 88v30" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
          <path d="M38 78h22M49 67v22" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </header>

  <main class="app-layout">
    <section class="start-panel" id="start-panel" aria-labelledby="start-title">
      <p class="kicker">Mode Select</p>
      <h2 id="start-title">どちらで遊びますか？</h2>

      <div class="mode-tabs" role="tablist" aria-label="ゲームモード">
        <button class="mode-tab active" id="moral-mode-button" type="button" role="tab" aria-selected="true" data-mode="moral">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3l7 3v5c0 4.4-2.8 8.4-7 10-4.2-1.6-7-5.6-7-10V6l7-3z"/>
              <path d="M8.5 12l2.2 2.2 4.8-5"/>
            </svg>
          </span>
          <span>
            <strong>モラルチェッカー</strong>
            <small>日常判断クイズ</small>
            <span class="mode-preview" aria-hidden="true">
              <span>5シーン</span>
              <span>総合スコア</span>
            </span>
          </span>
        </button>
        <button class="mode-tab" id="insight-mode-button" type="button" role="tab" aria-selected="false" data-mode="insight">
          <span class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 6.5h14v8H9l-4 3v-11z"/>
              <path d="M8.5 10h.01M12 10h.01M15.5 10h.01"/>
            </svg>
          </span>
          <span>
            <strong>男心理解ゲーム</strong>
            <small>会話読み取りクイズ</small>
            <span class="mode-preview" aria-hidden="true">
              <span>5人</span>
              <span>相性診断</span>
            </span>
          </span>
        </button>
      </div>

      <div class="mode-description" id="mode-description">
        日常の迷いやすい場面で、相手や周囲に配慮した選択を選びます。
      </div>

      <div class="panel-actions">
        <button class="primary-button" id="start-button" type="button">モラル編を始める</button>
      </div>
    </section>
  </main>

  <footer>
    <p>Hackathon 2027 Team 17</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
