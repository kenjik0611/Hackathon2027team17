<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モラルチェック編 - シーン選択</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="main.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="app-header">
    <div class="header-inner scene-select-header">
      <div class="hero-copy">
        <p class="kicker">Moral Check</p>
        <h1>モラルチェック編</h1>
        <p class="lead">シーンを選んで、その場面でのモラル判断クイズに挑戦しましょう。</p>
      </div>
    </div>
  </header>

  <main class="app-layout scene-select-layout">
    <section class="start-panel" aria-labelledby="scene-select-title">
      <p class="kicker">Scene Select</p>
      <h2 id="scene-select-title">どのシーンで遊びますか？</h2>

      <div class="selection-showcase moral-showcase" aria-hidden="true">
        <div class="selection-showcase-copy">
          <span class="selection-tag">Pick a Scene</span>
          <strong>日常のひっかかりをチェック</strong>
        </div>
        <img class="selection-showcase-image" src="assets/result-type-starter.png" alt="">
      </div>

      <div class="moral-progress" aria-live="polite">
        <div>
          <strong id="progress-summary">0 / 5 テーマ完了</strong>
          <span id="anonymous-label">匿名で記録します</span>
        </div>
        <a class="primary-button summary-button" href="summary.html">集計結果を見る</a>
      </div>

      <div class="scene-grid">
        <a class="scene-card" href="house_Kiyose/house.html" data-theme-id="house">
          <span class="scene-icon" aria-hidden="true">🏠</span>
          <span>
            <strong>家庭</strong>
            <small>家族や同居人との場面</small>
            <small class="theme-status" data-theme-status="house">未完了</small>
          </span>
        </a>

        <a class="scene-card" href="office_Arita/office.html" data-theme-id="office">
          <span class="scene-icon" aria-hidden="true">🏢</span>
          <span>
            <strong>職場</strong>
            <small>同僚や上司との場面</small>
            <small class="theme-status" data-theme-status="office">未完了</small>
          </span>
        </a>

        <a class="scene-card" href="online_Suzuki/online.html" data-theme-id="online">
          <span class="scene-icon" aria-hidden="true">💬</span>
          <span>
            <strong>オンライン</strong>
            <small>SNSやチャットでの場面</small>
            <small class="theme-status" data-theme-status="online">未完了</small>
          </span>
        </a>

        <a class="scene-card" href="outsideCompany_Fukazawa/outsideCompany.html" data-theme-id="outsideCompany">
          <span class="scene-icon" aria-hidden="true">🤝</span>
          <span>
            <strong>社外</strong>
            <small>取引先やお客様との場面</small>
            <small class="theme-status" data-theme-status="outsideCompany">未完了</small>
          </span>
        </a>

        <a class="scene-card" href="publicSpace_Kudo/publicSpace.html" data-theme-id="publicSpace">
          <span class="scene-icon" aria-hidden="true">🚉</span>
          <span>
            <strong>公共の場</strong>
            <small>電車や街中などの場面</small>
            <small class="theme-status" data-theme-status="publicSpace">未完了</small>
          </span>
        </a>
      </div>

      <div class="panel-actions">
        <a class="ghost-button" href="../index.html">トップへ戻る</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Hackathon 2027 Team 17</p>
  </footer>
  <script src="moralResultStore.js"></script>
  <script src="main.js"></script>
</body>
</html>
