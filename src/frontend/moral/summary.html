<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モラルチェック集計結果 - Team 17</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="summary.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="app-header">
    <div class="header-inner summary-header">
      <div class="hero-copy">
        <p class="kicker">Moral Summary</p>
        <h1>モラルチェック集計結果</h1>
        <p class="lead">5テーマの回答状況と、総合スコア・5軸の判断傾向を匿名でまとめます。</p>
      </div>
    </div>
  </header>

  <main class="app-layout summary-layout">
    <section class="start-panel summary-panel" aria-labelledby="summary-title">
      <div class="summary-top">
        <div>
          <p class="kicker">Anonymous</p>
          <h2 id="summary-title">現在の集計</h2>
          <p id="summary-meta" class="summary-meta"></p>
        </div>
        <div class="total-score">
          <strong id="total-score">0</strong>
          <span>/ 100</span>
        </div>
      </div>

      <div class="completion-box" id="completion-box"></div>

      <div class="summary-grid">
        <section class="summary-section" aria-labelledby="radar-title">
          <h3 id="radar-title">5軸バランス</h3>
          <svg class="radar-chart" id="radar-chart" viewBox="0 0 220 220" role="img" aria-label="5軸スコアのレーダーチャート"></svg>
        </section>

        <section class="summary-section" aria-labelledby="axis-title">
          <h3 id="axis-title">評価軸スコア</h3>
          <div class="axis-list" id="axis-list"></div>
        </section>
      </div>

      <section class="summary-section" aria-labelledby="theme-title">
        <h3 id="theme-title">テーマ別の完了状況</h3>
        <div class="theme-list" id="theme-list"></div>
      </section>

      <section class="summary-section" aria-labelledby="comment-title">
        <h3 id="comment-title">AI風コメント</h3>
        <p class="summary-comment" id="summary-comment"></p>
      </section>

      <section class="summary-section" aria-labelledby="markdown-title">
        <h3 id="markdown-title">Markdown出力</h3>
        <textarea id="markdown-output" readonly></textarea>
        <p class="save-message" id="save-message" aria-live="polite"></p>
      </section>

      <div class="panel-actions summary-actions">
        <button class="ghost-button" id="copy-markdown" type="button">Markdownをコピー</button>
        <button class="primary-button" id="save-record" type="button">最新結果として保存</button>
        <a class="ghost-button link-button" href="main.html">シーン選択へ戻る</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Hackathon 2027 Team 17</p>
  </footer>

  <script src="moralResultStore.js"></script>
  <script src="summary.js"></script>
</body>
</html>
